<!DOCTYPE html>
<html>

<head>
  <title>X Feed Viewer</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 14px;
    }

    #form {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #161b22;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    #form h3 {
      margin-bottom: 12px;
      font-size: 16px;
      color: #58a6ff;
    }

    select,
    input {
      margin: 6px 0;
      padding: 10px;
      font-size: 14px;
      width: 100%;
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #2ea043;
      transform: translateY(-1px);
    }

    #addProfileBtn,
    #deleteProfileBtn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1f6feb;
    }

    #addProfileBtn:hover,
    #deleteProfileBtn:hover {
      background: #388bfd;
    }

    #deleteProfileBtn {
      background: #da3633;
    }

    #deleteProfileBtn:hover {
      background: #f85149;
    }

    #addProfileBtn img,
    #deleteProfileBtn img {
      width: 16px;
      height: 16px;
    }

    #output {
      margin-top: 24px;
      width: 100vw;
      padding: 10px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #output a {
      margin: 4px 0;
      font-size: 13px;
      color: #58a6ff;
      text-decoration: none;
      word-break: break-word;
      max-width: 90%;
    }

    #output a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div id="form">
    <h3>Enter Tokens</h3>
    <select id="profileSelect"></select>
    <input id="auth" placeholder="auth_token" />
    <input id="ct0" placeholder="ct0 token" />
    <button id="submit">View Feed</button>
    <button id="addProfileBtn">
      <img src="plus.png" alt="Add" />
      Add Profile
    </button>
    <button id="deleteProfileBtn">
      <img src="trash.png" alt="Delete" />
      Delete Profile
    </button>
  </div>
  <div id="output"></div>
  <script src="popup.js"></script>
</body>

</html>
